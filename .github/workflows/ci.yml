# VisionGuard CI (Task 6.6): lint, test, then build the Docker image on every push.
name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Lint (ruff)
        run: ruff check app api src tests

      - name: Run tests (pytest)
        run: pytest -v

  docker-build:
    needs: lint-and-test          # only build an image from code that passed the checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the web image
        run: docker build -t visionguard-web:${{ github.sha }} .

      - name: Show image size
        run: docker image ls visionguard-web

# No secrets are needed: tests use a fake model and the image is only built, not pushed.
# If a later step needs one (for example a registry password), it is added in
# GitHub -> Settings -> Secrets and variables -> Actions, and read here as
# ${{ secrets.NAME }}. It is never written into this file, because workflow files are
# committed and visible to anyone who can read the repository.
